name: CI

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: [20.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install root dependencies
      run: npm ci
      
    - name: Install backend dependencies
      run: npm ci --workspace=backend
      
    - name: Run backend tests
      run: npm test --workspace=backend
      env:
        NODE_ENV: test

  frontend-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: [20.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install root dependencies
      run: npm ci
      
    - name: Install frontend dependencies
      run: npm ci --workspace=frontend
      
    - name: Build frontend
      run: npm run build --workspace=frontend

  integration-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [backend-tests, frontend-tests]
    strategy:
      matrix:
        node-version: [20.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install all dependencies
      run: |
        npm ci
        npm ci --workspace=backend
        npm ci --workspace=frontend
      
    - name: Start backend server
      run: |
        npm run start --workspace=backend &
        sleep 5
      env:
        NODE_ENV: test
        PORT: 3001
        
    - name: Test API endpoints
      run: |
        # Test health endpoint
        curl -f http://localhost:3001/health || exit 1
        
        # Test sources endpoint
        curl -f http://localhost:3001/api/sources || exit 1
        
        # Test shutdowns endpoint
        curl -f http://localhost:3001/api/shutdowns || exit 1
        
        # Test impact calculator with valid data
        curl -f -X POST http://localhost:3001/api/impact/calc \
          -H "Content-Type: application/json" \
          -d '{"duration": 30, "affectedWorkers": 800000}' || exit 1
        
        # Test impact calculator with invalid data (should return 400)
        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:3001/api/impact/calc \
          -H "Content-Type: application/json" \
          -d '{"duration": 500, "affectedWorkers": 800000}')
        if [ "$HTTP_CODE" != "400" ]; then
          echo "Expected 400 for invalid input, got $HTTP_CODE"
          exit 1
        fi
        
        echo "All integration tests passed!"

  security-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: [20.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: |
        npm ci
        npm ci --workspace=backend
        npm ci --workspace=frontend
        
    - name: Run npm audit (backend)
      run: npm audit --workspace=backend --audit-level=high
      continue-on-error: true
      
    - name: Run npm audit (frontend)
      run: npm audit --workspace=frontend --audit-level=high
      continue-on-error: true
      
    - name: Check for secrets
      run: |
        if grep -r "api_key\s*=\s*['\"][^'\"]*['\"]" --include="*.js" --include="*.ts" --include="*.tsx" .; then
          echo "Found potential hardcoded API keys!"
          exit 1
        fi
        echo "No hardcoded secrets detected"
