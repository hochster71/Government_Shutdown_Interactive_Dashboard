name: Fetch RSS and Commit Snapshots

on:
  schedule:
    - cron: '*/10 * * * *' # every 10 minutes
  workflow_dispatch:

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Run RSS fetcher
        env:
          TZ: UTC
        run: |
          python3 scripts/fetch_rss.py

      - name: Commit and push snapshots
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest_rss_*.json || true
          if git diff --staged --quiet; then
            echo "No new RSS snapshots"
          else
            git commit -m "chore: add RSS snapshots (scheduled)"
            git push
          fi
